<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>PaterGuide</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060912;--ink:#E9E6DE;--mute:#8C95A8;--line:rgba(233,230,222,.14);--err:#F0A3A3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#060912}
*{box-sizing:inherit;scrollbar-width:none}*::-webkit-scrollbar{display:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
.aurora{position:fixed;inset:-20%;z-index:-2;pointer-events:none;background:radial-gradient(40% 35% at 25% 30%,rgba(59,79,196,.32),transparent 70%),radial-gradient(35% 30% at 78% 72%,rgba(30,120,140,.2),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(6%,-4%,0) scale(1.08)}}
.flag{position:fixed;z-index:-1;right:-4vmin;top:50%;translate:0 -50%;width:min(92vmin,860px);opacity:0;filter:blur(3px) saturate(.85);transform:scale(.96);transition:opacity .7s,transform 1.2s cubic-bezier(.2,.7,.2,1);pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 78%)}
.flag svg{display:block;width:100%;height:auto}.flag.on{opacity:.3;transform:scale(1)}body.inq .flag.on{opacity:.13}
.wrap{max-width:900px;margin:0 auto;min-height:100dvh;padding:32px 24px 48px;display:flex;flex-direction:column}
.home{justify-content:center}.q{max-width:640px}
.mute{color:var(--mute)}.sm{font-size:.85rem}.xs{font-size:.75rem}
h1{font-family:'Instrument Serif',serif;font-weight:400;margin:0;outline:none}
.home h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;max-width:640px;margin-top:24px}
.fade{animation:fade .6s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.85rem}
.lang button{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:4px 6px}.lang button[aria-pressed=true]{color:var(--ink)}
ul{list-style:none;padding:0;margin:40px 0 0}
.c{display:block;width:100%;background:none;border:0;color:inherit;text-align:left;padding:6px 0;cursor:pointer;font:inherit;transition:opacity .5s}
.c .n{display:block;font-family:'Instrument Serif',serif;font-size:clamp(2.6rem,8vw,4.2rem);line-height:1.1;transition:transform .5s}
.c .t{display:block;min-height:1.3em;color:var(--mute);font-size:.9rem;opacity:0;transition:opacity .5s}
ul:hover .c{opacity:.35}ul .c:hover,ul .c:focus-visible{opacity:1}.c:hover .n,.c:focus-visible .n{transform:translateX(12px)}.c:hover .t,.c:focus-visible .t{opacity:1}
@media(hover:none){.c .t{opacity:1}}
ul.sel .c:not(.on){opacity:0!important}
.more{margin-top:28px;max-width:360px;position:relative}
.search{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;padding:10px 0}.search:focus{outline:none;border-color:var(--ink)}
.res{display:flex;flex-direction:column;margin-top:6px}.res button{background:none;border:0;color:var(--mute);font:inherit;text-align:left;padding:7px 0;cursor:pointer}.res button:hover,.res button:focus-visible{color:var(--ink)}
.portal{position:fixed;inset:0;z-index:50;background:var(--bg);pointer-events:none;clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .8s cubic-bezier(.7,0,.2,1)}.portal.on{clip-path:circle(150% at var(--x,50%) var(--y,50%))}
:focus-visible{outline:2px solid #9DB0FF;outline-offset:3px;border-radius:4px}
a,.lnk{color:var(--mute);background:none;border:0;font:inherit;cursor:pointer;padding:0}.lnk:hover{color:var(--ink)}
.mini{display:inline-block;width:22px;vertical-align:-4px;margin-right:8px;border-radius:2px;overflow:hidden}.mini svg{display:block;width:100%;height:auto}
.bar{height:1px;background:var(--line);margin-top:24px}.bar i{display:block;height:1px;background:var(--ink);transition:width .5s}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0}
main h1{font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.15}
.in{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:1.25rem;padding:12px 0}.in:focus{outline:none;border-color:var(--ink)}
.opt{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:12px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,background .2s}.opt:hover{border-color:rgba(233,230,222,.4)}.opt[aria-checked=true]{border-color:var(--ink);background:rgba(233,230,222,.1)}
.rec{color:#9DB0FF;font-size:.75rem;white-space:nowrap;align-self:center}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:36px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 28px;font:inherit;font-weight:500;cursor:pointer}.btn:hover{opacity:.9}.btn[disabled]{background:rgba(233,230,222,.2);color:rgba(233,230,222,.6);cursor:not-allowed;width:100%;margin-top:28px}
.err{color:var(--err);font-size:.9rem;margin-top:16px}
dl{margin:28px 0 0;border-top:1px solid var(--line)}.it{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}dt{font-size:.85rem;color:var(--mute)}dd{margin:4px 0 0;overflow-wrap:anywhere}
.ins{margin-top:28px;border-left:1px solid #9DB0FF;padding-left:16px}.ins p{margin:0 0 10px;font-size:.95rem;line-height:1.5}
@media(prefers-reduced-motion:reduce){.aurora,.fade{animation:none}.portal{transition:none}}
</style></head><body><div class="aurora" aria-hidden="true"></div><div id="app"></div><div class="portal" id="portal" aria-hidden="true"></div><div class="flag" id="flag" aria-hidden="true"></div>
<script>
const sg=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},ss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let L=sg("pg:lang",(navigator.language||"fr").startsWith("en")?"en":"fr");
const tr=s=>{const p=s.split("|");return L==="en"&&p.length>1?p[1]:p[0]};
const CODES="AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI CV KH CM CA CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI KW KG LA LV LB LS LR LY LI LT LU MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG MK NO OM PK PW PA PG PY PE PH PL PT QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA KR SS ES LK SD SR SE CH SY TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VA VE VN YE ZM ZW HK MO TW PS XK PR".split(" ");
const FEAT=["US","FR","CA","GB","BE","DE","IT","NL"];
const TAG={US:"Visas, études, travail, Diversity Visa|Visas, study, work, Diversity Visa",FR:"Études, titres de séjour, vie quotidienne|Study, residence permits, daily life",CA:"Permis d’études, travail, immigration|Study permits, work, immigration",GB:"Études, travail, visites|Study, work, visits",BE:"Études, travail, vie en Europe|Study, work, life in Europe",DE:"Études, emploi qualifié, installation|Study, skilled work, relocation",IT:"Études, tourisme, installation|Study, tourism, relocation",NL:"Études, travail, installation|Study, work, relocation"};
const nm=c=>{try{return new Intl.DisplayNames([L],{type:"region"}).of(c)||c}catch(e){return c}};
const nz=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
/* Drapeaux vectoriels (aperçu : l’image externe est bloquée ici ; le vrai projet utilisera le paquet flag-icons) */
const stripes=(cols,vert)=>`<svg viewBox="0 0 30 20" preserveAspectRatio="none">${cols.map((c,i)=>vert?`<rect x="${i*10}" width="10.02" height="20" fill="${c}"/>`:`<rect y="${i*20/cols.length}" width="30" height="${20/cols.length+.02}" fill="${c}"/>`).join("")}</svg>`;
const star=(cx,cy,r)=>{let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,k=i%2?r*.4:r;p.push((cx+k*Math.cos(a)).toFixed(2)+","+(cy+k*Math.sin(a)).toFixed(2))}return`<polygon points="${p.join(" ")}" fill="#fff"/>`};
const usF=()=>{let s='<svg viewBox="0 0 76 40"><rect width="76" height="40" fill="#B22234"/>';for(let i=1;i<13;i+=2)s+=`<rect y="${i*40/13}" width="76" height="${40/13}" fill="#fff"/>`;s+='<rect width="30.4" height="21.5" fill="#3C3B6E"/>';for(let r=0;r<9;r++)for(let c=0;c<(r%2?5:6);c++)s+=star((r%2?5:2.5)+c*5,2.4+r*2.3,1);return s+"</svg>"};
const FL={US:usF,FR:()=>stripes(["#0055A4","#fff","#EF4135"],1),BE:()=>stripes(["#000","#FAE042","#ED2939"],1),DE:()=>stripes(["#000","#DD0000","#FFCE00"]),IT:()=>stripes(["#009246","#fff","#CE2B37"],1),NL:()=>stripes(["#AE1C28","#fff","#21468B"]),
CA:()=>'<svg viewBox="0 0 40 20"><rect width="40" height="20" fill="#fff"/><rect width="10" height="20" fill="#D52B1E"/><rect x="30" width="10" height="20" fill="#D52B1E"/><path transform="translate(20 10.6) scale(.78)" fill="#D52B1E" d="M0-10 1.6-6 4-7 3.2-3 6.5-4.5 5.5-1 8 0 4.5 3.2 5 5.5 1 4.7.8 9H-.8L-1 4.7-5 5.5-4.5 3.2-8 0-5.5-1-6.5-4.5-3.2-3-4-7-1.6-6z"/></svg>',
GB:()=>'<svg viewBox="0 0 60 30" preserveAspectRatio="none"><rect width="60" height="30" fill="#012169"/><path stroke="#fff" stroke-width="6" d="m0 0 60 30m0-30L0 30"/><path stroke="#C8102E" stroke-width="2.5" d="m0 0 60 30m0-30L0 30"/><path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60"/><path stroke="#C8102E" stroke-width="6" d="M30 0v30M0 15h60"/></svg>'};
const flagEl=document.getElementById("flag");
function showFlag(c){if(c&&FL[c]){flagEl.innerHTML=FL[c]();flagEl.classList.add("on")}else flagEl.classList.remove("on")}

/* ---- Libellés des options (FR|EN) ---- */
const YN={yes:"Oui|Yes",no:"Non|No",unsure:"Je ne sais pas|Not sure"};
const O={
purpose:{tourism:"Tourisme ou court séjour|Tourism or short stay",study:"Études|Study",work:"Emploi|Employment",fvisit:"Visite à ma famille|Visiting family",freunion:"Regroupement familial|Family reunification",immigration:"Installation durable|Permanent relocation",business:"Voyage d’affaires|Business trip",medical:"Soins médicaux|Medical care",dv:"Diversity Visa (loterie)|Diversity Visa (lottery)",other:"Autre|Other"},
tdur:{d7:"Moins d’une semaine|Under a week",d14:"1 à 2 semaines|1–2 weeks",d30:"2 à 4 semaines|2–4 weeks",m3:"1 à 3 mois|1–3 months",m3p:"Plus de 3 mois|Over 3 months"},
tstyle:{culture:"Culture et histoire|Culture and history",nature:"Nature et randonnée|Nature and hiking",city:"Villes et shopping|Cities and shopping",beach:"Plages et détente|Beaches and relaxation",events:"Événements ou festivals|Events or festivals"},
sLevel:{lang:"Cours de langue|Language course",voc:"Formation professionnelle|Vocational training",bach:"Licence / Bachelor|Bachelor’s",mast:"Master|Master’s",phd:"Doctorat|PhD"},
sAdm:{none:"Pas encore de candidature|Not applied yet",applying:"Candidatures en cours|Applications in progress",accepted:"J’ai une admission|I have an admission"},
ltest:{yes:"Oui|Yes",plan:"Je prévois de le passer|Planning to take it",no:"Non|No",unsure:"Je ne sais pas si c’est requis|Not sure if required"},
sFund:{self:"Économies personnelles|Personal savings",family:"Soutien familial|Family support",schol:"Bourse|Scholarship",loan:"Prêt|Loan",work:"Travail sur place|Work on site"},
wOffer:{yes:"Oui, j’ai une offre|Yes, I have an offer",inter:"Je suis en entretiens|I am interviewing",search:"Je cherche activement|Actively searching",none:"Pas encore|Not yet"},
degree:{sec:"Secondaire / Bac|High school",voc:"Diplôme professionnel|Vocational",bach:"Licence / Bachelor|Bachelor’s",mast:"Master|Master’s",phd:"Doctorat|PhD"},
exp:{e2:"Moins de 2 ans|Under 2 years",e5:"2 à 5 ans|2–5 years",e10:"5 à 10 ans|5–10 years",e10p:"Plus de 10 ans|Over 10 years"},
fRel:{spouse:"Conjoint(e)|Spouse",child:"Enfant|Child",parent:"Parent|Parent",sib:"Frère ou sœur|Sibling",fiance:"Fiancé(e)|Fiancé(e)",other:"Autre proche|Other relative"},
fStat:{cit:"Citoyen(ne)|Citizen",pr:"Résident(e) permanent(e)|Permanent resident",temp:"Résident(e) temporaire (études, travail)|Temporary resident",unsure:"Je ne sais pas|Not sure"},
iRoute:{skill:"Travail qualifié|Skilled work",family:"Famille|Family",study:"Études puis installation|Study then settle",prov:"Programme provincial|Provincial program",invest:"Investissement ou entrepreneuriat|Investment or entrepreneurship",unsure:"Je ne sais pas encore|Not sure yet"},
iAge:{a1:"18–24",a2:"25–34",a3:"35–44",a4:"45+"},
bType:{meet:"Réunions ou négociations|Meetings or negotiations",conf:"Conférence ou salon|Conference or trade fair",prosp:"Prospection de marché|Market research",train:"Formation|Training"},
inv:{yes:"Oui, confirmé|Yes, confirmed",prog:"En cours|In progress",no:"Non|No"},
mCare:{cons:"Consultation|Consultation",surg:"Intervention chirurgicale|Surgery",long:"Traitement de longue durée|Long-term treatment",unsure:"Je ne sais pas encore|Not sure yet"},
dvStatus:{considering:"Je me renseigne|I’m exploring",entered:"J’ai déjà participé|I have entered",selected:"J’ai été sélectionné(e)|I was selected"},
dvStage:{letter:"J’attends mon avis officiel|Waiting for official notice",docs:"Je prépare mes documents|Preparing documents",int:"Entretien programmé|Interview scheduled"},
dvElig:YN,
status:{researching:"Je me renseigne|I’m researching",started:"J’ai commencé un dossier|I started an application",hasVisa:"J’ai déjà un visa ou un permis|I already have a visa or permit",hasAppt:"J’ai un rendez-vous (ambassade, consulat, centre de visas)|I have an appointment",refused:"J’ai déjà eu un refus|I was refused before"},
stage:{form:"Formulaire rempli|Form completed",fee:"Frais payés|Fees paid",docs:"Documents envoyés|Documents submitted",bio:"Biométrie ou entretien faits|Biometrics or interview done",wait:"En attente de décision|Awaiting decision"},
vExp:{ok:"Valide plus de 6 mois|Valid for over 6 months",soon:"Expire dans moins de 6 mois|Expires within 6 months",gone:"Expiré|Expired"},
appt:{w2:"Dans moins de 2 semaines|Within 2 weeks",m2:"Dans 1 à 2 mois|In 1–2 months",later:"Plus tard|Later"},
refR:{docs:"Documents insuffisants|Insufficient documents",funds:"Ressources financières|Financial resources",ties:"Attaches dans mon pays|Ties to my home country",unk:"Je ne sais pas|I don’t know"},
travelDate:{lt3:"Dans moins de 3 mois|Within 3 months","3to6":"Dans 3 à 6 mois|In 3–6 months","6to12":"Dans 6 à 12 mois|In 6–12 months",gt12:"Dans plus d’un an|In over a year",undecided:"Je ne sais pas encore|Not sure yet"},
flexible:{yes:"Oui, assez flexible|Yes, fairly flexible",no:"Non, elle est fixe|No, it is fixed"},
comp:{alone:"Seul(e)|Alone",partner:"Avec mon conjoint ou ma conjointe|With my partner",family:"Avec ma famille|With my family"},
kids:{k1:"1 personne de plus|1 more person",k2:"2 personnes|2 people",k3:"3 à 4 personnes|3–4 people",k5:"5 ou plus|5 or more"},
proof:{yes:"Oui, complètement|Yes, fully",part:"En partie|Partly",no:"Pas encore|Not yet",unsure:"Je ne sais pas|Not sure"},
budget:{b1:"Moins de 500 $|Under $500",b2:"500 à 1 000 $|$500–1,000",b3:"1 000 à 2 000 $|$1,000–2,000",b4:"2 000 à 3 500 $|$2,000–3,500",b5:"Plus de 3 500 $|Over $3,500",unsure:"Je ne sais pas|Not sure"},
housing:{arranged:"Oui, c’est organisé|Yes, arranged",searching:"Je suis en recherche|Searching",none:"Pas encore|Not yet"},
lang:{good:"À l’aise|Comfortable",basic:"Notions de base|Basic",none:"Pas du tout|Not at all"},
topics:{docs:"Documents requis et démarches officielles|Required documents and official procedures",visa:"Catégories de visa et conditions|Visa categories and conditions",interview:"Préparer un entretien|Interview preparation",housing:"Logement|Housing",budget:"Coût de la vie et budget mensuel|Cost of living and monthly budget",edujob:"Études et emploi|Education and employment",health:"Santé et assurance|Healthcare and insurance",transport:"Transports et vie quotidienne|Transport and daily life",first30:"Les 30 premiers jours|The first 30 days",official:"Comprendre les sources officielles|Understanding official sources",scam:"Éviter les arnaques|Avoiding scams",lang:"Langue et intégration|Language and integration"}};
const LANGS={US:"l’anglais|English",GB:"l’anglais|English",CA:"l’anglais ou le français|English or French",FR:"le français|French",BE:"le français ou le néerlandais|French or Dutch",DE:"l’allemand|German",IT:"l’italien|Italian",NL:"le néerlandais|Dutch"};
const ln=x=>tr(LANGS[x.c]||"la langue locale|the local language");
const S1="Profil|Profile",S2="Objectif|Goal",S3="Votre projet|Your plan",S4="Démarches|Procedures",S5="Voyage|Travel",S6="Moyens|Resources",S7="Besoins|Needs";
const P=x=>x.a.purpose,is=(x,k,...v)=>v.includes(x.a[k]),inP=(x,...v)=>v.includes(P(x));
const isLong=x=>inP(x,"study","work","immigration","freunion")||x.a.tdur==="m3p";
const noDV=x=>!(P(x)==="dv"&&x.a.dvStatus!=="selected");
/* ---- Moteur adaptatif : chaque question décide si elle apparaît selon pays + réponses ---- */
const Q=[
{id:"residence",st:S1,ty:"text",dl:1,q:()=>"Dans quel pays vivez-vous actuellement ?|Which country do you live in now?",h:()=>"Choisissez dans la liste ou tapez-le.|Pick from the list or type it."},
{id:"nationality",st:S1,ty:"text",dl:1,q:()=>"Quelle est votre nationalité ?|What is your nationality?",h:x=>`Les conditions d’entrée vers ${nm(x.c)} dépendent souvent de la nationalité.|Entry conditions for ${nm(x.c)} often depend on nationality.`},
{id:"purpose",st:S2,ty:"single",o:x=>Object.keys(O.purpose).filter(k=>k!=="dv"||x.c==="US"),q:x=>`Pourquoi souhaitez-vous aller en ${nm(x.c)} ?|Why do you want to go to ${nm(x.c)}?`,h:()=>"Votre choix détermine toutes les questions suivantes.|Your choice shapes every question that follows."},
{id:"tdur",st:S3,ty:"single",if:x=>inP(x,"tourism"),q:()=>"Combien de temps prévoyez-vous de rester ?|How long do you plan to stay?"},
{id:"tstyle",st:S3,ty:"multi",opt:1,if:x=>inP(x,"tourism"),q:()=>"Qu’aimeriez-vous y faire ?|What would you like to do there?"},
{id:"sLevel",st:S3,ty:"single",if:x=>inP(x,"study"),q:()=>"Quel type de formation visez-vous ?|What kind of programme are you aiming for?"},
{id:"activity",st:S3,ty:"text",if:x=>inP(x,"study","work"),q:x=>P(x)==="study"?"Quel domaine d’études ?|Which field of study?":"Dans quel métier ou secteur ?|Which profession or sector?"},
{id:"sAdm",st:S3,ty:"single",if:x=>inP(x,"study"),q:()=>"Où en êtes-vous côté admission ?|Where do you stand on admission?",h:()=>"Une admission est en général la première étape d’une demande d’études.|An admission is usually the first step of a study application."},
{id:"sFund",st:S3,ty:"multi",if:x=>inP(x,"study"),q:()=>"Comment financerez-vous vos études ?|How will you fund your studies?"},
{id:"wOffer",st:S3,ty:"single",if:x=>inP(x,"work"),q:()=>"Avez-vous une offre d’emploi ?|Do you have a job offer?"},
{id:"degree",st:S3,ty:"single",if:x=>inP(x,"work","immigration"),q:()=>"Quel est votre plus haut diplôme ?|What is your highest qualification?"},
{id:"exp",st:S3,ty:"single",if:x=>inP(x,"work","immigration"),q:()=>"Combien d’années d’expérience professionnelle ?|How many years of work experience?"},
{id:"iRoute",st:S3,ty:"single",if:x=>inP(x,"immigration"),o:x=>Object.keys(O.iRoute).filter(k=>k!=="prov"||x.c==="CA"),q:x=>`Quelle piste vous semble la plus proche pour ${nm(x.c)} ?|Which route feels closest for ${nm(x.c)}?`,h:()=>"Peu importe si vous hésitez : nous comparerons les pistes officielles.|No worries if you’re unsure: we will compare the official routes."},
{id:"iAge",st:S3,ty:"single",opt:1,if:x=>inP(x,"immigration"),q:()=>"Dans quelle tranche d’âge êtes-vous ?|Which age range are you in?",h:()=>"Certains systèmes de sélection en tiennent compte.|Some selection systems take age into account."},
{id:"ltest",st:S3,ty:"single",if:x=>inP(x,"study","immigration"),q:x=>`Avez-vous un test de langue reconnu (${ln(x)}) ?|Do you have a recognised language test (${ln(x)})?`},
{id:"fRel",st:S3,ty:"single",if:x=>inP(x,"fvisit","freunion"),q:x=>P(x)==="fvisit"?"Quel est votre lien avec la personne qui vous accueille ?|How are you related to the person hosting you?":"Quel est votre lien avec la personne qui vous parraine ?|How are you related to your sponsor?"},
{id:"fStat",st:S3,ty:"single",if:x=>inP(x,"fvisit","freunion"),q:x=>`Quel est son statut en ${nm(x.c)} ?|What is their status in ${nm(x.c)}?`,h:()=>"Les règles dépendent fortement de ce statut.|The rules depend heavily on this status."},
{id:"bType",st:S3,ty:"single",if:x=>inP(x,"business"),q:()=>"Quel est l’objet de votre voyage d’affaires ?|What is the purpose of your business trip?"},
