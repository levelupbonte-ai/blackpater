<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="25%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1814"/>
      <stop offset="50%" stop-color="#120e0c"/>
      <stop offset="100%" stop-color="#080605"/>
    </radialGradient>
    <radialGradient id="copperAura" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(201, 138, 82, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
    <radialGradient id="congoAura" cx="30%" cy="80%" r="50%">
      <stop offset="0%" stop-color="rgba(110, 20, 35, 0.35)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="70%" stop-color="#eedfc8"/>
      <stop offset="100%" stop-color="#c98a52"/>
    </linearGradient>

    <linearGradient id="bpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="bpOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#e02400"/>
    </linearGradient>
  </defs>

  <!-- Deep Luxury Canvas -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#copperAura)"/>
  <rect width="1200" height="630" fill="url(#congoAura)"/>
  
  <!-- Subtle Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(239, 232, 220, 0.14)" stroke-width="1.5"/>

  <!-- Tricolor Accent Top Right -->
  <g transform="translate(1030, 48)">
    <rect x="0" y="0" width="30" height="4" fill="#1b6fd6" rx="2"/>
    <rect x="34" y="0" width="30" height="4" fill="#f7d618" rx="2"/>
    <rect x="68" y="0" width="30" height="4" fill="#ce1126" rx="2"/>
  </g>

  <!-- Left Content: Brand & Identity -->
  <g transform="translate(72, 80)">
    <!-- Pill Badge -->
    <g>
      <rect x="0" y="0" width="360" height="34" rx="17" fill="rgba(201, 138, 82, 0.12)" stroke="rgba(201, 138, 82, 0.4)" stroke-width="1"/>
      <circle cx="18" cy="17" r="4.5" fill="#c98a52"/>
      <text x="32" y="22" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#c98a52" text-transform="uppercase">OFFICIAL DIGITAL PLATFORM</text>
    </g>

    <!-- Main Title: BLACK PATER (No underscore!) -->
    <text x="0" y="140" font-family="'League Gothic', 'Impact', 'Arial Black', sans-serif" font-size="96" font-weight="900" letter-spacing="3" fill="url(#textGrad)">BLACK PATER</text>

    <!-- Subtitle: Jean-Pierre Lofumbwa · Le Prof -->
    <text x="2" y="195" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#efe8dc">Jean-Pierre Lofumbwa · « Le Prof »</text>

    <!-- Roles & Mission -->
    <text x="2" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="rgba(239, 232, 220, 0.75)" letter-spacing="0.5">Congolese Cultural Ambassador · Educator · Content Creator · Translator</text>

    <!-- Verified Accolades & Press -->
    <g transform="translate(0, 280)">
      <!-- Card 1: VoyageUtah Feature -->
      <g>
        <rect x="0" y="0" width="320" height="66" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(239, 232, 220, 0.12)" stroke-width="1"/>
        <text x="16" y="26" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c98a52" text-transform="uppercase">VOYAGEUTAH MAGAZINE</text>
        <text x="16" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f4eee3">Rising Stars · Salt Lake City</text>
      </g>

      <!-- Card 2: Substack Feature -->
      <g transform="translate(336, 0)">
        <rect x="0" y="0" width="320" height="66" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(239, 232, 220, 0.12)" stroke-width="1"/>
        <text x="16" y="26" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c98a52" text-transform="uppercase">CHRONIQUE ÉDITORIALE</text>
        <text x="16" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f4eee3">Le Soldat Digital du Congo</text>
      </g>
    </g>

    <!-- Domain & Footer Pills -->
    <g transform="translate(0, 390)">
      <text x="0" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#c98a52" letter-spacing="1.5">DOMAIN: blackpater.com</text>
      <text x="240" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(239, 232, 220, 0.5)">#1 Student DRC 2015 · 5 Languages · Utah, USA</text>
    </g>
  </g>

  <!-- Right Side: Large Prominent Circular BP Logo -->
  <g transform="translate(850, 165)">
    <!-- Glow behind logo -->
    <circle cx="150" cy="150" r="145" fill="rgba(201, 138, 82, 0.12)"/>
    <circle cx="150" cy="150" r="140" fill="none" stroke="#251d18" stroke-width="18"/>
    
    <!-- Scaled BP vectors -->
    <g transform="translate(0, 0) scale(0.6)">
      <!-- Blue B -->
      <path d="M 160 215 C 178 188, 202 172, 235 172 C 255 172, 268 182, 264 200 C 258 218, 238 226, 212 228 L 160 231 Z M 148 290 C 165 258, 195 248, 228 248 C 256 248, 272 262, 265 288 C 256 318, 226 332, 185 332 C 162 332, 142 324, 132 312 Z M 162 188 C 190 152, 232 140, 270 148 C 245 160, 222 178, 208 202 C 230 198, 262 202, 282 216 C 305 232, 308 260, 296 288 C 280 326, 238 348, 182 348 C 142 348, 116 330, 116 295 C 116 265, 134 238, 160 220 C 142 208, 135 192, 138 174 C 142 152, 162 135, 192 124 C 152 142, 126 182, 116 230 L 116 348 L 162 188 Z" fill="url(#bpBlue)"/>
      <!-- Orange P -->
      <path d="M 285 220 C 310 190, 345 180, 380 185 C 408 190, 420 208, 412 232 C 402 262, 368 280, 330 280 L 300 280 Z M 265 195 C 302 165, 355 152, 405 162 C 445 172, 468 202, 452 248 C 432 305, 380 326, 320 326 L 288 326 L 245 365 L 220 365 L 282 175 C 258 185, 235 200, 218 220 L 235 188 C 260 162, 305 142, 362 138 C 320 148, 285 168, 265 195 Z" fill="url(#bpOrange)"/>
    </g>
  </g>
</svg>